  <line x1="23" y1="24" x2="26" y2="24" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="41" y2="24" stroke="white" stroke-width="2" stroke-linecap="round"/>
